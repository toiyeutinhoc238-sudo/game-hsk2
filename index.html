<!DOCTYPE html>
<html lang="vi" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <script src="lms-adapter.js"></script>
    <script src="js/questions.js"></script>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
</head>

<body>
    <!-- Top Control Bar (Fixed Top Right: Sound) -->
    <div class="top-controls">
        <button id="musicToggle" class="control-btn sound-control" onclick="toggleMusic(event)" title="Bật/Tắt âm thanh" aria-label="Bật/Tắt âm thanh">
            <span class="icon">🔊</span>
        </button>
    </div>

    <!-- LMS Toast Notification -->
    <div id="lms-toast" class="lms-toast"></div>

    <div class="container"
        style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <header>
            <h1>AI LÀ TRIỆU PHÚ</h1>
            <p style="text-align: center; color: var(--secondary); font-weight: 600; letter-spacing: 1px;">PHIÊN BẢN HSK
                2</p>
            <p
                style="text-align: center; color: var(--text-muted); margin-top: 1rem; max-width: 600px; margin-left: auto; margin-right: auto;">
                Chinh phục 15 câu hỏi từ vựng để giành lấy danh hiệu Triệu Phú HSK 2. Bạn đã sẵn sàng thử thách kiến
                thức của mình?
            </p>
        </header>

        <section class="lesson-selection" style="width: 100%;">
            <div class="lesson-grid" id="lessonGrid">
                <!-- Lessons will be generated here -->
            </div>
        </section>

        <footer style="margin-top: 4rem; color: var(--text-muted); font-size: 0.9rem;">
            &copy; 2026 HSK 2 Millionaire Edition
        </footer>
    </div>

    <script>
        const bgMusic = new Audio('ailatrieuphu.mp3');
        bgMusic.loop = true;

        const grid = document.getElementById('lessonGrid');
        const allTopics = Object.keys(hsk2Vocab);
        const filteredTopics = allTopics.filter(topic => hsk2Vocab[topic].length >= 9);

        // Group topics by base name to handle parts
        const groups = [];
        const groupMap = new Map();

        filteredTopics.forEach(topic => {
            const match = topic.match(/^(.*?)\s*\(Phần\s*(\d+)\)$/);
            const baseName = match ? match[1] : topic;
            const partNum = match ? parseInt(match[2]) : null;

            if (!groupMap.has(baseName)) {
                const group = { baseName, items: [] };
                groupMap.set(baseName, group);
                groups.push(group);
            }
            groupMap.get(baseName).items.push({ name: topic, part: partNum });
        });

        groups.forEach((group, gIdx) => {
            group.items.forEach((item, iIdx) => {
                const card = document.createElement('div');
                card.className = 'glass lesson-card';
                card.innerHTML = `
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem;">CHỦ ĐỀ</div>
                    <h3 style="font-size: 1.1rem; line-height: 1.2;">${item.name}</h3>
                    <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.5rem;">${hsk2Vocab[item.name].length} từ vựng</p>
                `;

                let linkId = `chude${gIdx + 1}`;
                if (group.items.length > 1) {
                    linkId += `_phan${item.part || (iIdx + 1)}`;
                }

                card.onclick = () => {
                    card.style.transform = 'scale(0.95)';
                    if (window.markInternalNavigation) {
                        window.markInternalNavigation();
                    }
                    setTimeout(() => {
                        window.location.href = `game.html?topic=${linkId}`;
                    }, 150);
                };
                grid.appendChild(card);
            });
        });

        // Audio Control (Based on HSK 4 architecture)
        let isMuted = (safeStorage.getItem('musicMuted') === 'true');

        function updateMusicUI() {
            const btn = document.getElementById('musicToggle');
            if (btn) {
                const icon = btn.querySelector('.icon') || btn;
                icon.textContent = isMuted ? '🔇' : '🔊';
            }
            bgMusic.muted = isMuted;
            if (isMuted) {
                bgMusic.pause();
            } else {
                if (bgMusic.paused) {
                    window.safePlayAudio ? window.safePlayAudio(bgMusic) : bgMusic.play().catch(e => {});
                }
            }
        }

        let lastToggleTime = 0;
        function toggleMusic(e) {
            if (e && e.preventDefault) e.preventDefault();
            const now = Date.now();
            if (now - lastToggleTime < 250) return; // Prevent double trigger from touch+click
            lastToggleTime = now;

            isMuted = !isMuted;
            safeStorage.setItem('musicMuted', isMuted ? 'true' : 'false');
            updateMusicUI();
            if (window.LMSAdapter && window.LMSAdapter.showToast) {
                window.LMSAdapter.showToast(isMuted ? '🔇 Đã tắt âm thanh' : '🔊 Đã bật âm thanh');
            }
        }
        window.toggleMusic = toggleMusic;

        window.setMuted = function (muted) {
            isMuted = !!muted;
            safeStorage.setItem('musicMuted', isMuted ? 'true' : 'false');
            updateMusicUI();
        };

        // Initialize state
        updateMusicUI();

        // Start music on first interaction (click or touch)
        const unlockAudio = () => {
            if (!isMuted && bgMusic.paused) {
                window.safePlayAudio ? window.safePlayAudio(bgMusic) : bgMusic.play().catch(e => {});
            }
        };
        ['click', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, unlockAudio, { once: true });
        });
    </script>

</body>

</html>
